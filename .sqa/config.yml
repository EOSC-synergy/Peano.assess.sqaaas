config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    gitlab.lrz.de/hpcsoftware/Peano:
      branch: p4
      repo: https://gitlab.lrz.de/hpcsoftware/Peano
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      gitlab.lrz.de/hpcsoftware/Peano git:
        commands:
        - /usr/bin/env sh .sqa/script.flimsy-sapphire-baboon.sh
        container: qc.acc_squirrely-scarlet-mole
  QC.Doc:
    repos:
      gitlab.lrz.de/hpcsoftware/Peano find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.freaky-white-dog.sh
        container: qc.doc_foggy-malachite-newfoundland
      gitlab.lrz.de/hpcsoftware/Peano git:
        commands:
        - /usr/bin/env sh .sqa/script.crappy-chestnut-sponge.sh
        container: qc.doc_grumpy-khaki-scorpion
      gitlab.lrz.de/hpcsoftware/Peano markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.flimsy-pink-bat.sh
        container: qc.doc_homely-zucchini-cuscus
  QC.Lic:
    repos:
      gitlab.lrz.de/hpcsoftware/Peano licensee:
        commands:
        - /usr/bin/env sh .sqa/script.sunny-cornflower-peccary.sh
        container: qc.lic_slaphappy-tan-tamarin
  QC.Sec:
    repos:
      gitlab.lrz.de/hpcsoftware/Peano bandit:
        commands:
        - /usr/bin/env sh .sqa/script.breezy-purple-harrier.sh
        container: qc.sec_cozy-red-mole
  QC.Sty:
    repos:
      gitlab.lrz.de/hpcsoftware/Peano flake8:
        commands:
        - /usr/bin/env sh .sqa/script.gummy-amethyst-monkey.sh
        container: qc.sty_hilly-tangerine-panda
      gitlab.lrz.de/hpcsoftware/Peano jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.tacky-buff-spaniel.sh
        container: qc.sty_silly-emerald-squirrel
      gitlab.lrz.de/hpcsoftware/Peano oclint:
        commands:
        - /usr/bin/env sh .sqa/script.blurry-cerise-jaguar.sh
        container: qc.sty_hazy-chartreuse-llama
  QC.Uni:
    repos:
      gitlab.lrz.de/hpcsoftware/Peano pytest:
        commands:
        - /usr/bin/env sh .sqa/script.scanty-emerald-termite.sh
        container: qc.uni_messy-corn-indri
  QC.Ver:
    repos:
      gitlab.lrz.de/hpcsoftware/Peano get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.goopy-amaranth-uguisu.sh
        container: qc.ver_beady-heliotrope-grasshopper
timeout: 5400
