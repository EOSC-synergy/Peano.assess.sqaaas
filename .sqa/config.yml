config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    gitlab.lrz.de/hpcsoftware/Peano:
      branch: p4
      repo: https://gitlab.lrz.de/hpcsoftware/Peano
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      gitlab.lrz.de/hpcsoftware/Peano git:
        commands:
        - /usr/bin/env sh .sqa/script.crappy-celadon-mammoth.sh
        container: qc.acc_zippy-ochre-husky
  QC.Doc:
    repos:
      gitlab.lrz.de/hpcsoftware/Peano find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.gimpy-sepia-stoat.sh
        container: qc.doc_scummy-vermilion-reindeer
      gitlab.lrz.de/hpcsoftware/Peano git:
        commands:
        - /usr/bin/env sh .sqa/script.geeky-rose-mau.sh
        container: qc.doc_hilly-linen-uakari
      gitlab.lrz.de/hpcsoftware/Peano markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.cheeky-wisteria-echidna.sh
        container: qc.doc_greasy-lilac-gerbil
  QC.Lic:
    repos:
      gitlab.lrz.de/hpcsoftware/Peano licensee:
        commands:
        - /usr/bin/env sh .sqa/script.stinky-harlequin-panda.sh
        container: qc.lic_beady-aquamarine-fish
  QC.Sec:
    repos:
      gitlab.lrz.de/hpcsoftware/Peano bandit:
        commands:
        - /usr/bin/env sh .sqa/script.freaky-seashell-maltese.sh
        container: qc.sec_gloppy-pink-argentino
  QC.Sty:
    repos:
      gitlab.lrz.de/hpcsoftware/Peano flake8:
        commands:
        - /usr/bin/env sh .sqa/script.beady-bistre-sparrow.sh
        container: qc.sty_cranky-fuchsia-alligator
      gitlab.lrz.de/hpcsoftware/Peano jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.hazy-dandelion-zebra.sh
        container: qc.sty_gummy-amber-toad
      gitlab.lrz.de/hpcsoftware/Peano oclint:
        commands:
        - /usr/bin/env sh .sqa/script.goopy-periwinkle-caracal.sh
        container: qc.sty_greasy-cinnamon-mongoose
  QC.Uni:
    repos:
      gitlab.lrz.de/hpcsoftware/Peano pytest:
        commands:
        - /usr/bin/env sh .sqa/script.breezy-periwinkle-hamster.sh
        container: qc.uni_beady-pink-mammoth
  QC.Ver:
    repos:
      gitlab.lrz.de/hpcsoftware/Peano get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.fuzzy-tan-shrew.sh
        container: qc.ver_stealthy-sepia-worm
timeout: 5400
