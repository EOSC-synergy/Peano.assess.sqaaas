config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: release/2.2.1
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    gitlab.lrz.de/hpcsoftware/Peano:
      branch: p4
      repo: https://gitlab.lrz.de/hpcsoftware/Peano
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      gitlab.lrz.de/hpcsoftware/Peano git:
        commands:
        - /usr/bin/env sh .sqa/script.chummy-cornflower-lizard.sh
        container: qc.acc_greasy-pink-mist
  QC.Doc:
    repos:
      gitlab.lrz.de/hpcsoftware/Peano find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.wimpy-scarlet-slug.sh
        container: qc.doc_smelly-mustard-albatross
      gitlab.lrz.de/hpcsoftware/Peano git:
        commands:
        - /usr/bin/env sh .sqa/script.stuffy-apricot-toad.sh
        container: qc.doc_shabby-silver-leopard
      gitlab.lrz.de/hpcsoftware/Peano markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.gimpy-amaranth-duck.sh
        container: qc.doc_seedy-emerald-baboon
  QC.Lic:
    repos:
      gitlab.lrz.de/hpcsoftware/Peano licensee:
        commands:
        - /usr/bin/env sh .sqa/script.paltry-lime-dogfish.sh
        container: qc.lic_flabby-amber-bonobo
  QC.Sec:
    repos:
      gitlab.lrz.de/hpcsoftware/Peano bandit:
        commands:
        - /usr/bin/env sh .sqa/script.skanky-mauve-bongo.sh
        container: qc.sec_droopy-red-dragon
  QC.Sty:
    repos:
      gitlab.lrz.de/hpcsoftware/Peano flake8:
        commands:
        - /usr/bin/env sh .sqa/script.wiggy-cobalt-kiwi.sh
        container: qc.sty_clammy-wheat-indri
      gitlab.lrz.de/hpcsoftware/Peano jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.wiggy-aqua-sparrow.sh
        container: qc.sty_muggy-saffron-mule
      gitlab.lrz.de/hpcsoftware/Peano oclint:
        commands:
        - /usr/bin/env sh .sqa/script.wimpy-malachite-lizard.sh
        container: qc.sty_ugly-apricot-sparrow
  QC.Uni:
    repos:
      gitlab.lrz.de/hpcsoftware/Peano pytest:
        commands:
        - /usr/bin/env sh .sqa/script.hazy-black-mongoose.sh
        container: qc.uni_gloppy-sangria-vulture
  QC.Ver:
    repos:
      gitlab.lrz.de/hpcsoftware/Peano get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.clammy-crimson-gorilla.sh
        container: qc.ver_lovely-ultramarine-discus
timeout: 5400
