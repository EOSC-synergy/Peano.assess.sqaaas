        commands:
        - /usr/bin/env sh .sqa/script.bluesy-indigo-hare.sh
        container: qc.sty_sleepy-rust-dalmatian
      gitlab.lrz.de/hpcsoftware/Peano oclint:
        commands:
        - /usr/bin/env sh .sqa/script.hilly-sangria-peccary.sh
        container: qc.sty_slaphappy-auburn-chipmunk
