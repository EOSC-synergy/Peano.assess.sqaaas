config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    gitlab.lrz.de/hpcsoftware/Peano:
      branch: p4
      repo: https://gitlab.lrz.de/hpcsoftware/Peano
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      gitlab.lrz.de/hpcsoftware/Peano git:
        commands:
        - /usr/bin/env sh .sqa/script.bumpy-brown-balinese.sh
        container: qc.acc_sleepy-cornflower-jaguar
  QC.Doc:
    repos:
      gitlab.lrz.de/hpcsoftware/Peano find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.crabby-ivory-tapir.sh
        container: qc.doc_wimpy-mauve-mule
      gitlab.lrz.de/hpcsoftware/Peano git:
        commands:
        - /usr/bin/env sh .sqa/script.nippy-olivine-ostrich.sh
        container: qc.doc_zippy-amaranth-ladybird
      gitlab.lrz.de/hpcsoftware/Peano markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.squeaky-maroon-weasel.sh
        container: qc.doc_trippy-olive-chamois
  QC.Lic:
    repos:
      gitlab.lrz.de/hpcsoftware/Peano licensee:
        commands:
        - /usr/bin/env sh .sqa/script.sleazy-azure-skunk.sh
        container: qc.lic_chummy-charcoal-beetle
  QC.Sec:
    repos:
      gitlab.lrz.de/hpcsoftware/Peano bandit:
        commands:
        - /usr/bin/env sh .sqa/script.ugly-goldenrod-woodlouse.sh
        container: qc.sec_slimy-cinnamon-slug
  QC.Sty:
    repos:
      gitlab.lrz.de/hpcsoftware/Peano flake8:
        commands:
        - /usr/bin/env sh .sqa/script.skinny-wheat-pig.sh
        container: qc.sty_gummy-charcoal-frise
      gitlab.lrz.de/hpcsoftware/Peano jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.tacky-indigo-skunk.sh
        container: qc.sty_wheezy-xanthic-squirt
      gitlab.lrz.de/hpcsoftware/Peano oclint:
        commands:
        - /usr/bin/env sh .sqa/script.goopy-brass-sloth.sh
        container: qc.sty_thirsty-lemon-quail
  QC.Uni:
    repos:
      gitlab.lrz.de/hpcsoftware/Peano pytest:
        commands:
        - /usr/bin/env sh .sqa/script.muggy-aqua-crane.sh
        container: qc.uni_hazy-crimson-skunk
  QC.Ver:
    repos:
      gitlab.lrz.de/hpcsoftware/Peano get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.lovely-aqua-husky.sh
        container: qc.ver_goopy-goldenrod-tortoise
timeout: 5400
